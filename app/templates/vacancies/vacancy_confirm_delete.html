{% extends 'base.html' %}

{% block title %}Удаление вакансии — ВППП{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h1 class="h4 mb-3">Удаление вакансии</h1>

                <p>
                    Вы действительно хотите удалить вакансию
                    <strong>«{{ vacancy.title }}»</strong>?
                </p>

                <p class="text-muted">
                    Это действие нельзя будет отменить.
                </p>

                <form method="post">
                    {% csrf_token %}

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            Удалить
                        </button>

                        <a href="{% url 'vacancy_detail' vacancy.pk %}" class="btn btn-outline-secondary">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
